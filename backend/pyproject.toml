[project]
name = "mcp-knowledge-base"
version = "0.1.0"
description = "基于 MCP 协议的企业知识库问答系统"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "fastmcp>=2.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
